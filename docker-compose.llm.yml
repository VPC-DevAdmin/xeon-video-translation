# Optional GPU LLM for the video project; apply after docker-compose.gpu.yml.
# Model assets must exist at LLM_LOCAL_MODEL_PATH in the shared models volume.
# Select an unoccupied LLM_GPU and set LLM_BASE_URL=http://llm-gpu:8000/v1
# in .env for both translation and optional dedicated avatar backends.
services:
  llm-gpu:
    image: ${LLM_GPU_IMAGE:-vllm/vllm-openai@sha256:c2914767605584b6d8f45686b82de173ecc99e781897aa3d0a66dacd72c51ae1}
    container_name: polyglot-llm-gpu
    restart: unless-stopped
    shm_size: 8gb
    environment:
      HF_HUB_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
    command:
      - ${LLM_LOCAL_MODEL_PATH:-/models/huggingface/hub/models--Qwen--Qwen3-30B-A3B-Instruct-2507/snapshots/0d7cf23991f47feeb3a57ecb4c9cee8ea4a17bfe}
      - --served-model-name
      - ${LLM_MODEL:-Qwen/Qwen3-30B-A3B-Instruct-2507}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --dtype
      - bfloat16
      - --max-model-len
      - ${LLM_GPU_MAX_MODEL_LEN:-16384}
      - --gpu-memory-utilization
      - ${LLM_GPU_MEMORY_UTILIZATION:-0.80}
      - --max-num-seqs
      - ${LLM_GPU_MAX_SEQS:-8}
      - --max-num-batched-tokens
      - ${LLM_GPU_BATCHED_TOKENS:-2048}
    ports:
      - "127.0.0.1:${LLM_GPU_PORT:-2081}:8000"
    volumes:
      - models:/models:ro
      - llm-cache:/root/.cache/vllm
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 15s
      timeout: 6s
      retries: 12
      start_period: 180s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${LLM_GPU:-1}"]
              capabilities: [gpu]
volumes:
  llm-cache:
