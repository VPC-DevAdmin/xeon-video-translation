# Mel parameters used by LatentSync's StableSyncNet (same as Wav2Lip's hparams).
audio:
  num_mels: 80
  rescale: true
  rescaling_max: 0.9
  use_lws: false
  n_fft: 800
  hop_size: 200
  win_size: 800
  sample_rate: 16000
  frame_shift_ms: null
  signal_normalization: true
  allow_clipping_in_normalization: true
  symmetric_mels: true
  max_abs_value: 4.0
  preemphasize: true
  preemphasis: 0.97
  min_level_db: -100
  ref_level_db: 20
  fmin: 55
  fmax: 7600
