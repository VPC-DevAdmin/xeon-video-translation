[project]
name = "polyglot-ingest-webrtc"
version = "0.1.0"
description = "WebRTC webcam ingest for polyglot-demo (GPU track)"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "aiortc==1.15.0",
  "av==17.1.0",
  "httpx>=0.27",
  "numpy>=1.26,<2",
  "Pillow>=10.4",
  "onnxruntime==1.23.2",
  "python-multipart>=0.0.18",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
