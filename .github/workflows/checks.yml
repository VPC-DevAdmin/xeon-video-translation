name: CPU checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -e ./shared -r backend/requirements-test.txt
      - run: python -m pytest shared/tests backend/tests services/lipsync-latentsync/tests tests/research -q
  webrtc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -c services/ingest-webrtc/requirements.lock -e ./services/ingest-webrtc pytest pytest-asyncio
      - run: python scripts/fetch_vad.py /tmp/silero.onnx
      - run: SILERO_TEST_MODEL=/tmp/silero.onnx PYTHONPATH=services/ingest-webrtc python -m pytest services/ingest-webrtc/tests -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: frontend}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --audit-level=high

  tensor-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ./shared pytest numpy==1.26.4 Pillow 'opencv-python-headless<4.12'
      - run: python -m pytest tests/media services/musetalk/tests -q
