# GPU overlay for the Dell XE7740 / 8x RTX PRO box (GPU track).
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
#   (or `make up-gpu`)
#
# Applied on top of docker-compose.yml: same service names, same volumes,
# same ports. It swaps images to the CUDA builds, hands each service its
# own GPU(s), and adds the WebRTC ingest service.
#
# GPU layout (0-7). Rationale in docs/gpu/README.md, "GPU assignment".
#   0      backend: whisper + NLLB + TTS. Shares comfortably on 96 GB.
#   1      lipsync-musetalk (real-time mode)
#   2-7    lipsync-latentsync workers (batch mode shards 16-frame chunks
#          across these; until sharding lands only GPU 2 is used)
# Override per host with BACKEND_GPU / MUSETALK_GPU / LATENTSYNC_GPUS
# (comma list, e.g. "4,5,6,7") in .env — the XE7740 shares GPUs 1-2 with vLLM containers, so it runs
# 0 / 3 / 4. Check `nvidia-smi` before picking; an occupied card shows up
# as a CUDA OOM at the first UNet call, not at startup.
#
# Requires the NVIDIA Container Toolkit on the host. Verify with:
#   docker run --rm --gpus all nvidia/cuda:12.8.1-base-ubuntu24.04 nvidia-smi

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.gpu
    image: polyglot-demo/backend:gpu
    environment:
      DEVICE: cuda
      CUDA_VISIBLE_DEVICES: "0"
      # GPU defaults. Large-v3 in fp16 is ~30x+ realtime on this class of
      # card, so there is no reason to keep `base`.
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-float16}
      NLLB_MODEL: ${NLLB_MODEL:-facebook/nllb-200-3.3B}
      # Several jobs can run at once on GPU; the stage-level semaphore is
      # still process-global, so keep this modest until the queue lands.
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-2}
      MAX_VIDEO_DURATION_SECONDS: ${MAX_VIDEO_DURATION_SECONDS:-600}
      # Final mux on the GPU's hardware encoder. Needs the `video` driver
      # capability below; watermark.py falls back to libx264 if it fails.
      VIDEO_ENCODER: ${VIDEO_ENCODER:-h264_nvenc}
      WARMUP_MODELS: ${WARMUP_MODELS:-true}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
      # Hugging Face auth via a mounted file rather than an env value, so
      # the token never lands in .env or shell history. Point HF_TOKEN_FILE
      # (in .env) at the host's token, typically ~/.cache/huggingface/token.
      # Needed on hosts whose egress IP is anonymously rate-limited (429)
      # and for gated repos (IndicF5). Unset => /dev/null => no token.
      HF_TOKEN_PATH: /run/secrets/hf_token
      OMP_NUM_THREADS: "16"
      MKL_NUM_THREADS: "16"
    volumes:
      - ${HF_TOKEN_FILE:-/dev/null}:/run/secrets/hf_token:ro
    deploy:
      resources:
        limits:
          cpus: "32.0"
          memory: 64g
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${BACKEND_GPU:-0}"]
              capabilities: [gpu]

  lipsync-musetalk:
    build:
      context: ./services/musetalk
      dockerfile: Dockerfile.gpu
    image: polyglot-demo/lipsync-musetalk:gpu
    environment:
      DEVICE: cuda
      CUDA_VISIBLE_DEVICES: "0"
      # fp32 for parity with the CPU build until outputs are compared;
      # MUSETALK_DTYPE=fp16 is the speed mode (upstream's CUDA default).
      MUSETALK_DTYPE: ${MUSETALK_DTYPE:-fp32}
      # Final encode on NVENC (MUSETALK_VIDEO_ENCODER=libx264 to opt out).
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
      # CPU-only knobs; harmless but meaningless here.
      KMP_AFFINITY: ""
      KMP_BLOCKTIME: ""
      HF_TOKEN_PATH: /run/secrets/hf_token
      # torch sees all 344 host cores and spawned 172 intra-op threads
      # inside an 8-CPU cgroup, which made every small CPU-side tensor op
      # 10-20x slower than it should be. Match the thread pool to the quota.
      OMP_NUM_THREADS: "16"
      MKL_NUM_THREADS: "16"
    volumes:
      - ${HF_TOKEN_FILE:-/dev/null}:/run/secrets/hf_token:ro
    deploy:
      resources:
        limits:
          cpus: "32.0"
          memory: 64g
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${MUSETALK_GPU:-1}"]
              capabilities: [gpu]

  lipsync-latentsync:
    build:
      context: ./services/lipsync-latentsync
      dockerfile: Dockerfile.gpu
    image: polyglot-demo/lipsync-latentsync:gpu
    # Several GPUs: the denoise loop is sharded across every visible card
    # (one UNet replica each; docs/gpu/mode2-batch.md). Compose cannot
    # build a device_ids list from one env var, so this service uses the
    # nvidia runtime directly and takes a comma list in LATENTSYNC_GPUS.
    runtime: nvidia
    # The denoise worker processes hand decoded chunks (~25 MB each) back
    # through torch.multiprocessing shared memory, i.e. /dev/shm. Docker's
    # default is 64 MB, which killed the workers with "No space left on
    # device" at the first result. Size for a whole clip in flight.
    shm_size: "16gb"
    environment:
      DEVICE: cuda
      NVIDIA_VISIBLE_DEVICES: ${LATENTSYNC_GPUS:-2}
      # The base compose file blanks CUDA_VISIBLE_DEVICES; re-expose every
      # card the runtime passed in (CUDA ignores indices that don't exist).
      CUDA_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
      # 0 = one replica per visible GPU.
      LATENTSYNC_UNET_REPLICAS: ${LATENTSYNC_UNET_REPLICAS:-0}
      # NVENC for the 25 fps re-encode on read and the final write.
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
      # fp16 is upstream's tested GPU path. The CPU bf16 jitter artifact
      # (docs/latentsync-pipeline.md §5) was specific to CPU bf16 autocast
      # and does not apply here; re-run the stability metric to confirm.
      LATENTSYNC_DTYPE: ${LATENTSYNC_DTYPE:-fp16}
      # CPU-only knobs; harmless but meaningless here.
      KMP_AFFINITY: ""
      KMP_BLOCKTIME: ""
      HF_TOKEN_PATH: /run/secrets/hf_token
      OMP_NUM_THREADS: "16"
      MKL_NUM_THREADS: "16"
    volumes:
      - ${HF_TOKEN_FILE:-/dev/null}:/run/secrets/hf_token:ro
    deploy:
      resources:
        limits:
          cpus: "32.0"
          memory: 96g

  # WebRTC ingest: browser webcam -> this service -> file in /jobs ->
  # backend job. See services/ingest-webrtc/README.md.
  ingest-webrtc:
    build:
      context: ./services/ingest-webrtc
      dockerfile: Dockerfile
    image: polyglot-demo/ingest-webrtc:dev
    container_name: polyglot-ingest-webrtc
    restart: unless-stopped
    environment:
      JOB_ARTIFACTS_DIR: /jobs
      # host networking (below) means no Docker DNS: reach the backend
      # through its published host port.
      BACKEND_URL: http://localhost:${BACKEND_PORT:-8088}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3030}
      # Public IP/hostname the browser can reach for ICE. Leave empty on a
      # single host (host-mode networking handles it); set it when the
      # browser is on another machine.
      INGEST_PUBLIC_IP: ${INGEST_PUBLIC_IP:-}
    volumes:
      - jobs:/jobs
      - ./services/ingest-webrtc/app:/app/app
      - ./services/ingest-webrtc/scripts:/app/scripts:ro
      # Fixture clips for the headless e2e client (scripts/e2e_client.py).
      - ./artifacts/inputs:/fixtures:ro
    # WebRTC media needs UDP ports the browser can reach. host networking
    # is the simplest correct answer on a single box; the service listens
    # on INGEST_PORT (default 8091) for the HTTP signalling API.
    network_mode: host
    depends_on:
      - backend

  frontend:
    build:
      args:
        NEXT_PUBLIC_API_BASE_URL: "http://localhost:${BACKEND_PORT:-8088}"
        NEXT_PUBLIC_INGEST_BASE_URL: "http://localhost:${INGEST_PORT:-8091}"
    environment:
      NEXT_PUBLIC_INGEST_BASE_URL: "http://localhost:${INGEST_PORT:-8091}"
