# GPU overlay for the Dell XE7740 / 8x RTX PRO box (GPU track).
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
#   (or `make up-gpu`)
#
# Applied on top of docker-compose.yml: same service names, same volumes,
# same ports. It swaps images to the CUDA builds, hands each service its
# own GPU(s), and adds the WebRTC ingest service.
#
# Shared-host defaults: GPU 0 speech, 1-2 external vLLM, 3 fast renderer,
# 4 and 7 batch, 5 avatar speech, 6 avatar renderer + WebRTC codec engines.
# Apply docker-compose.avatar.yml for the dedicated avatar services.
# Generate a UUID-based assignment overlay with scripts/gpu_layout.py.
# The quality-audio profile needs GPU 7 excluded from LATENTSYNC_GPUS.
# No external vLLM container is started, stopped or reconfigured here.
#
# Requires the NVIDIA Container Toolkit on the host. Verify with:
#   docker run --rm --gpus all nvidia/cuda:12.8.1-base-ubuntu24.04 nvidia-smi

services:
  audio-quality:
    profiles: [quality-audio]
    build: ./services/audio-quality
    image: polyglot-demo/audio-quality:gpu
    environment:
      JOB_ARTIFACTS_DIR: /jobs
      HF_HOME: /models/huggingface
      HF_TOKEN_PATH: /run/secrets/hf_token
      DEVICE: cuda
      GPU_REQUIRED: "true"
      GPU_PROFILE: ${GPU_PROFILE:-0}
      GPU_CUDNN_BENCHMARK: ${GPU_CUDNN_BENCHMARK:-0}
      ORT_CUDNN_CONV_ALGO_SEARCH: ${ORT_CUDNN_CONV_ALGO_SEARCH:-HEURISTIC}
    volumes:
      - jobs:/jobs
      - models:/models
      - ${HF_TOKEN_FILE:-/dev/null}:/run/secrets/hf_token:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${AUDIO_QUALITY_GPU:-7}"]
              capabilities: [gpu]
  backend:
    build:
      context: ./backend
      additional_contexts:
        gpu_shared: ./shared
      dockerfile: Dockerfile.gpu
    image: polyglot-demo/backend:gpu
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DEVICE: cuda
      GPU_REQUIRED: "true"
      GPU_PROFILE: ${GPU_PROFILE:-0}
      GPU_CUDNN_BENCHMARK: ${GPU_CUDNN_BENCHMARK:-0}
      ORT_CUDNN_CONV_ALGO_SEARCH: ${ORT_CUDNN_CONV_ALGO_SEARCH:-HEURISTIC}
      CUDA_VISIBLE_DEVICES: "0"
      # GPU defaults. Large-v3 in fp16 is ~30x+ realtime on this class of
      # card, so there is no reason to keep `base`.
      # Translation, overrun rewrites and the avatar assistant all use the
      # OpenAI-compatible LLM server on the host (vLLM, Qwen3-30B-A3B). NLLB
      # stays available as TRANSLATE_BACKEND=nllb for hosts without one.
      TRANSLATE_BACKEND: ${TRANSLATE_BACKEND:-llm}
      QUALITY_TRANSLATE_BACKEND: ${QUALITY_TRANSLATE_BACKEND:-llm}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:2080/v1}
      LLM_MODEL: ${LLM_MODEL:-Qwen/Qwen3-30B-A3B-Instruct-2507}
      LLM_MAX_CONCURRENT: ${LLM_MAX_CONCURRENT:-2}
      LLM_MAX_PENDING: ${LLM_MAX_PENDING:-8}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-4096}
      LLM_API_KEY_FILE: /run/secrets/llm_api_key
      # With a rewriter available, an overrun past TTS_MAX_SPEED is
      # re-translated shorter instead of failing the job.
      REWRITE_OVERRUNS: ${REWRITE_OVERRUNS:-true}
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-float16}
      NLLB_MODEL: ${NLLB_MODEL:-facebook/nllb-200-3.3B}
      # One fast lane and one batch lane; speech inference is serialized.
      LATENTSYNC_REALTIME_FACTOR: ${LATENTSYNC_REALTIME_FACTOR:-5.0}
      MAX_PENDING_JOBS: ${MAX_PENDING_JOBS:-32}
      MUSETALK_FRAME_BUDGET_MB: ${MUSETALK_FRAME_BUDGET_MB:-4096}
      LATENTSYNC_FRAME_BUDGET_MB: ${LATENTSYNC_FRAME_BUDGET_MB:-8192}
      # The fast preset is 10-step LatentSync on its own renderer and lane.
      # Without this URL fast jobs would queue in the batch lane.
      LATENTSYNC_FAST_SERVICE_URL: ${LATENTSYNC_FAST_SERVICE_URL:-http://lipsync-fast:8000}
      TTS_SEGMENT_RETRIES: ${TTS_SEGMENT_RETRIES:-3}
      MAX_VIDEO_DURATION_SECONDS: ${MAX_VIDEO_DURATION_SECONDS:-120}
      # Final mux on the GPU's hardware encoder. Needs the `video` driver
      # capability below; GPU failures are reported without switching to software.
      VIDEO_ENCODER: ${VIDEO_ENCODER:-h264_nvenc}
      WARMUP_MODELS: ${WARMUP_MODELS:-true}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
      # Hugging Face auth via a mounted file rather than an env value, so
      # the token never lands in .env or shell history. Point HF_TOKEN_FILE
      # (in .env) at the host's token, typically ~/.cache/huggingface/token.
      # Needed on hosts whose egress IP is anonymously rate-limited (429)
      # and for gated repos (IndicF5). Unset => /dev/null => no token.
      HF_TOKEN_PATH: /run/secrets/hf_token
      OMP_NUM_THREADS: "16"
      MKL_NUM_THREADS: "16"
    volumes:
      - ${HF_TOKEN_FILE:-/dev/null}:/run/secrets/hf_token:ro
      # Optional bearer token for the LLM server (unset => none sent).
      - ${LLM_API_KEY_FILE:-/dev/null}:/run/secrets/llm_api_key:ro
    deploy:
      resources:
        limits:
          cpus: "32.0"
          memory: 64g
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${BACKEND_GPU:-0}"]
              capabilities: [gpu]

  # Dedicated fast LatentSync renderer (10 steps). Denoise is ~65% of each
  # render window, so it shards the UNet one process per GPU exactly like the
  # batch service; LATENTSYNC_FAST_GPUS is a comma list (default 3,5) and must
  # not overlap LATENTSYNC_GPUS.
  lipsync-fast:
    image: polyglot-demo/lipsync-latentsync:gpu
    build:
      context: ./services/lipsync-latentsync
      additional_contexts:
        gpu_shared: ./shared
      dockerfile: Dockerfile.gpu
    container_name: polyglot-lipsync-fast
    restart: unless-stopped
    runtime: nvidia
    # Worker processes hand decoded chunks back through /dev/shm.
    shm_size: "16gb"
    environment:
      DEVICE: cuda
      GPU_REQUIRED: "true"
      GPU_PROFILE: ${GPU_PROFILE:-0}
      GPU_CUDNN_BENCHMARK: ${GPU_CUDNN_BENCHMARK:-0}
      ORT_CUDNN_CONV_ALGO_SEARCH: ${ORT_CUDNN_CONV_ALGO_SEARCH:-HEURISTIC}
      MODEL_CACHE_DIR: /models
      JOB_ARTIFACTS_DIR: /jobs
      HF_HOME: /models/huggingface
      HF_TOKEN_PATH: /run/secrets/hf_token
      NVIDIA_VISIBLE_DEVICES: ${LATENTSYNC_FAST_GPUS:-3,5}
      CUDA_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
      LATENTSYNC_DTYPE: fp16
      LATENTSYNC_VIDEO_ENCODER: h264_nvenc
      LATENTSYNC_STEPS: "10"
      LATENTSYNC_GUIDANCE: "1.5"
      LATENTSYNC_ENABLE_DEEPCACHE: "0"
      LATENTSYNC_SHARD_MODE: ${LATENTSYNC_SHARD_MODE:-process}
      # 0 = one UNet replica per visible GPU.
      LATENTSYNC_UNET_REPLICAS: "0"
      LATENTSYNC_FRAME_BUDGET_MB: ${LATENTSYNC_FRAME_BUDGET_MB:-8192}
      OMP_NUM_THREADS: "16"
      MKL_NUM_THREADS: "16"
    volumes:
      - jobs:/jobs
      - models:/models
      - ${HF_TOKEN_FILE:-/dev/null}:/run/secrets/hf_token:ro
    ports:
      - "127.0.0.1:${LATENTSYNC_FAST_PORT:-8094}:8000"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5).read()"]
      interval: 20s
      timeout: 6s
      retries: 6
    deploy:
      resources:
        limits: {cpus: "32.0", memory: 96g}

  # MuseTalk is no longer used by any mode preset (fast = 10-step LatentSync).
  # Kept behind a profile for A/B comparisons. MUSETALK_GPU must not be in
  # LATENTSYNC_FAST_GPUS or LATENTSYNC_GPUS when the profile is enabled.
  lipsync-musetalk:
    profiles: [draft-lipsync]
    build:
      context: ./services/musetalk
      additional_contexts:
        gpu_shared: ./shared
      dockerfile: Dockerfile.gpu
    image: polyglot-demo/lipsync-musetalk:gpu
    environment:
      DEVICE: cuda
      GPU_REQUIRED: "true"
      GPU_PROFILE: ${GPU_PROFILE:-0}
      GPU_CUDNN_BENCHMARK: ${GPU_CUDNN_BENCHMARK:-0}
      ORT_CUDNN_CONV_ALGO_SEARCH: ${ORT_CUDNN_CONV_ALGO_SEARCH:-HEURISTIC}
      CUDA_VISIBLE_DEVICES: "0"
      # fp16 is upstream's CUDA default for the UNet/VAE; fp32 was only the
      # CPU parity setting. MUSETALK_DTYPE=fp32 to A/B against it.
      MUSETALK_FRAME_BUDGET_MB: ${MUSETALK_FRAME_BUDGET_MB:-4096}
      MUSETALK_DETECTION_CACHE: ${MUSETALK_DETECTION_CACHE:-1}
      MUSETALK_DTYPE: ${MUSETALK_DTYPE:-fp16}
      MUSETALK_VIDEO_ENCODER: h264_nvenc
      AVATAR_GPU_COMPOSITE: ${AVATAR_GPU_COMPOSITE:-1}
      # Final encode on NVENC (MUSETALK_VIDEO_ENCODER=libx264 to opt out).
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
      # CPU-only knobs; harmless but meaningless here.
      KMP_AFFINITY: ""
      KMP_BLOCKTIME: ""
      HF_TOKEN_PATH: /run/secrets/hf_token
      # torch sees all 344 host cores and spawned 172 intra-op threads
      # inside an 8-CPU cgroup, which made every small CPU-side tensor op
      # 10-20x slower than it should be. Match the thread pool to the quota.
      OMP_NUM_THREADS: "16"
      MKL_NUM_THREADS: "16"
    volumes:
      - ${HF_TOKEN_FILE:-/dev/null}:/run/secrets/hf_token:ro
    deploy:
      resources:
        limits:
          cpus: "32.0"
          memory: 64g
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${MUSETALK_GPU:-5}"]
              capabilities: [gpu]

  lipsync-latentsync:
    build:
      context: ./services/lipsync-latentsync
      additional_contexts:
        gpu_shared: ./shared
      dockerfile: Dockerfile.gpu
    image: polyglot-demo/lipsync-latentsync:gpu
    # Several GPUs: the denoise loop is sharded across every visible card
    # (one UNet replica each; docs/gpu/mode2-batch.md). Compose cannot
    # build a device_ids list from one env var, so this service uses the
    # nvidia runtime directly and takes a comma list in LATENTSYNC_GPUS.
    runtime: nvidia
    # The denoise worker processes hand decoded chunks (~25 MB each) back
    # through torch.multiprocessing shared memory, i.e. /dev/shm. Docker's
    # default is 64 MB, which killed the workers with "No space left on
    # device" at the first result. Size for a whole clip in flight.
    shm_size: "16gb"
    environment:
      DEVICE: cuda
      GPU_REQUIRED: "true"
      GPU_PROFILE: ${GPU_PROFILE:-0}
      GPU_CUDNN_BENCHMARK: ${GPU_CUDNN_BENCHMARK:-0}
      ORT_CUDNN_CONV_ALGO_SEARCH: ${ORT_CUDNN_CONV_ALGO_SEARCH:-HEURISTIC}
      NVIDIA_VISIBLE_DEVICES: ${LATENTSYNC_GPUS:-4,7}
      # The base compose file blanks CUDA_VISIBLE_DEVICES; re-expose every
      # card the runtime passed in (CUDA ignores indices that don't exist).
      CUDA_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
      # 0 = one replica per visible GPU.
      LATENTSYNC_SHARD_MODE: ${LATENTSYNC_SHARD_MODE:-process}
      LATENTSYNC_COMPILE: ${LATENTSYNC_COMPILE:-0}
      LATENTSYNC_FRAME_BUDGET_MB: ${LATENTSYNC_FRAME_BUDGET_MB:-8192}
      LATENTSYNC_UNET_REPLICAS: ${LATENTSYNC_UNET_REPLICAS:-0}
      # NVENC for the 25 fps re-encode on read and the final write.
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
      # fp16 is upstream's tested GPU path. The CPU bf16 jitter artifact
      # (docs/latentsync-pipeline.md §5) was specific to CPU bf16 autocast
      # and does not apply here; re-run the stability metric to confirm.
      LATENTSYNC_DTYPE: ${LATENTSYNC_DTYPE:-fp16}
      LATENTSYNC_VIDEO_ENCODER: h264_nvenc
      # CPU-only knobs; harmless but meaningless here.
      KMP_AFFINITY: ""
      KMP_BLOCKTIME: ""
      HF_TOKEN_PATH: /run/secrets/hf_token
      OMP_NUM_THREADS: "16"
      MKL_NUM_THREADS: "16"
    volumes:
      - ${HF_TOKEN_FILE:-/dev/null}:/run/secrets/hf_token:ro
    deploy:
      resources:
        limits:
          cpus: "32.0"
          memory: 96g

  # WebRTC ingest: browser webcam -> this service -> file in /jobs ->
  # backend job. See services/ingest-webrtc/README.md.
  ingest-webrtc:
    build:
      context: ./services/ingest-webrtc
      dockerfile: Dockerfile
    image: polyglot-demo/ingest-webrtc:dev
    container_name: polyglot-ingest-webrtc
    restart: unless-stopped
    environment:
      JOB_ARTIFACTS_DIR: /jobs
      # host networking (below) means no Docker DNS: reach the backend
      # through its published host port.
      BACKEND_URL: http://localhost:${BACKEND_PORT:-8088}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3030}
      # STUN/TURN configuration is sent to both WebRTC peers.
      # Run scripts/setup_local.py once to generate the proxy secret.
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      ICE_SERVERS_JSON: ${ICE_SERVERS_JSON:-[]}
      INGEST_MAX_SECONDS: ${MAX_VIDEO_DURATION_SECONDS:-120}
      INGEST_MAX_MB: ${MAX_VIDEO_SIZE_MB:-100}
      PYTHONFAULTHANDLER: "1"
      WEBRTC_GPU_CODECS: ${WEBRTC_GPU_CODECS:-1}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
      INGEST_MAX_SESSIONS: ${INGEST_MAX_SESSIONS:-4}
      AVATAR_MAX_SESSIONS: ${AVATAR_MAX_SESSIONS:-1}
      AVATAR_BACKEND_URL: ${AVATAR_BACKEND_URL:-http://localhost:${BACKEND_PORT:-8088}}
      AVATAR_MUSETALK_URL: ${AVATAR_MUSETALK_URL:-http://localhost:${MUSETALK_PORT:-8089}}
      AVATAR_VAD_RMS: ${AVATAR_VAD_RMS:-450}
      AVATAR_VAD_BACKEND: ${AVATAR_VAD_BACKEND:-energy}
      SILERO_VAD_MODEL: /models/silero/silero_vad.onnx
      AVATAR_VAD_THRESHOLD: ${AVATAR_VAD_THRESHOLD:-0.5}
      AVATAR_ENDPOINT_SECONDS: ${AVATAR_ENDPOINT_SECONDS:-0.6}
      AVATAR_LIVE_CAPTIONS: ${AVATAR_LIVE_CAPTIONS:-false}
      AVATAR_RENDER_TIMEOUT: ${AVATAR_RENDER_TIMEOUT:-5}
      AVATAR_MAX_STORAGE_MB: ${AVATAR_MAX_STORAGE_MB:-256}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:-}
      TURN_URLS_JSON: ${TURN_URLS_JSON:-[]}
    # Codec engines intentionally share the avatar renderer card. GPU frame
    # exchange is still host-backed; this does not reserve compute capacity.
    deploy:
      resources:
        limits: {cpus: "8.0", memory: 8g}
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${INGEST_GPU:-${AVATAR_MUSETALK_GPU:-6}}"]
              capabilities: [gpu]
    volumes:
      - jobs:/jobs
      - models:/models:ro
      - ./services/ingest-webrtc/app:/app/app
      - ./services/ingest-webrtc/scripts:/app/scripts:ro
      # Fixture clips for the headless e2e client (scripts/e2e_client.py).
      - ./artifacts/inputs:/fixtures:ro
    # WebRTC media needs UDP ports the browser can reach. host networking
    # is the simplest correct answer on a single box; the service listens
    # on INGEST_PORT (default 8091) for the HTTP signalling API.
    network_mode: host
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "${INGEST_PORT:-8091}"]
    depends_on:
      - backend

  frontend:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      args:
        NEXT_PUBLIC_API_BASE_URL: "/api"
        NEXT_PUBLIC_INGEST_BASE_URL: "/ingest"
    environment:
      NEXT_PUBLIC_INGEST_BASE_URL: "/ingest"
      API_PROXY_TARGET: http://backend:8000
      INGEST_PROXY_TARGET: http://host.docker.internal:${INGEST_PORT:-8091}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}

  # Optional authenticated HTTPS entrypoint for a remote browser.
  web:
    image: caddy:2.10.2-alpine
    profiles: [web]
    network_mode: host
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
      FRONTEND_PORT: ${FRONTEND_PORT:-3030}
      DEMO_USER: ${DEMO_USER:-demo}
      DEMO_PASSWORD_HASH: ${DEMO_PASSWORD_HASH:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
