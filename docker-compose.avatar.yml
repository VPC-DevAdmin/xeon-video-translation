# Optional dedicated capacity. Apply after the base and GPU compose files.
# Pick unoccupied GPUs; default 5 and 6 must be excluded from LATENTSYNC_GPUS.
services:
  backend-avatar:
    build:
      context: ./backend
      dockerfile: Dockerfile.gpu
    image: polyglot-demo/backend:gpu
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DEVICE: cuda
      CUDA_VISIBLE_DEVICES: "0"
      MODEL_CACHE_DIR: /models
      JOB_ARTIFACTS_DIR: /jobs
      HF_HOME: /models/huggingface
      HF_TOKEN_PATH: /run/secrets/hf_token
      WHISPER_MODEL: ${AVATAR_WHISPER_MODEL:-small}
      WHISPER_COMPUTE_TYPE: float16
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b-instruct}
      RECOVER_JOBS: "false"
      WARMUP_MODELS: "false"
      OMP_NUM_THREADS: "8"
      MKL_NUM_THREADS: "8"
    volumes:
      - models:/models
      - jobs:/jobs
      - ${HF_TOKEN_FILE:-/dev/null}:/run/secrets/hf_token:ro
    ports: ["127.0.0.1:8092:8000"]
    deploy:
      resources:
        limits: {cpus: "16.0", memory: 32g}
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${AVATAR_BACKEND_GPU:-5}"]
              capabilities: [gpu]
  musetalk-avatar:
    build:
      context: ./services/musetalk
      dockerfile: Dockerfile.gpu
    image: polyglot-demo/lipsync-musetalk:gpu
    restart: unless-stopped
    environment:
      DEVICE: cuda
      CUDA_VISIBLE_DEVICES: "0"
      MODEL_CACHE_DIR: /models
      JOB_ARTIFACTS_DIR: /jobs
      HF_HOME: /models/huggingface
      HF_TOKEN_PATH: /run/secrets/hf_token
      MUSETALK_DTYPE: ${MUSETALK_DTYPE:-fp32}
      OMP_NUM_THREADS: "8"
      MKL_NUM_THREADS: "8"
    volumes:
      - models:/models
      - jobs:/jobs
      - ${HF_TOKEN_FILE:-/dev/null}:/run/secrets/hf_token:ro
    ports: ["127.0.0.1:8093:8000"]
    deploy:
      resources:
        limits: {cpus: "16.0", memory: 32g}
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${AVATAR_MUSETALK_GPU:-6}"]
              capabilities: [gpu]
  ingest-webrtc:
    environment:
      AVATAR_BACKEND_URL: http://localhost:8092
      AVATAR_MUSETALK_URL: http://localhost:8093
    depends_on:
      - backend-avatar
      - musetalk-avatar
