# Optional dedicated capacity. Apply after the base and GPU compose files.
# Pick unoccupied GPUs; default 5 and 6 must be excluded from LATENTSYNC_GPUS.
services:
  backend-avatar:
    build:
      context: ./backend
      additional_contexts:
        gpu_shared: ./shared
      dockerfile: Dockerfile.gpu
    image: polyglot-demo/backend:gpu
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DEVICE: cuda
      GPU_REQUIRED: "true"
      GPU_PROFILE: ${GPU_PROFILE:-0}
      CUDA_VISIBLE_DEVICES: "0"
      MODEL_CACHE_DIR: /models
      JOB_ARTIFACTS_DIR: /jobs
      HF_HOME: /models/huggingface
      HF_TOKEN_PATH: /run/secrets/hf_token
      WHISPER_MODEL: ${AVATAR_WHISPER_MODEL:-small}
      WHISPER_COMPUTE_TYPE: float16
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:2080/v1}
      LLM_MODEL: ${LLM_MODEL:-Qwen/Qwen3-30B-A3B-Instruct-2507}
      LLM_MAX_CONCURRENT: ${LLM_MAX_CONCURRENT:-2}
      LLM_MAX_PENDING: ${LLM_MAX_PENDING:-8}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-4096}
      LLM_API_KEY_FILE: /run/secrets/llm_api_key
      VIDEO_ENCODER: h264_nvenc
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
      RECOVER_JOBS: "false"
      WARMUP_MODELS: "true"
      AVATAR_WARMUP_INFERENCE: "1"
      AVATAR_WARMUP_AUDIO_PATH: ${AVATAR_WARMUP_AUDIO_PATH:-/models/avatar-warmup/speech.wav}
      OMP_NUM_THREADS: "8"
      MKL_NUM_THREADS: "8"
    volumes:
      - models:/models
      - jobs:/jobs
      - ${HF_TOKEN_FILE:-/dev/null}:/run/secrets/hf_token:ro
      - ${LLM_API_KEY_FILE:-/dev/null}:/run/secrets/llm_api_key:ro
    ports: ["127.0.0.1:8092:8000"]
    deploy:
      resources:
        limits: {cpus: "16.0", memory: 32g}
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${AVATAR_BACKEND_GPU:-5}"]
              capabilities: [gpu]
  musetalk-avatar:
    build:
      context: ./services/musetalk
      additional_contexts:
        gpu_shared: ./shared
      dockerfile: Dockerfile.gpu
    image: polyglot-demo/lipsync-musetalk:gpu
    restart: unless-stopped
    environment:
      DEVICE: cuda
      GPU_REQUIRED: "true"
      GPU_PROFILE: ${GPU_PROFILE:-0}
      CUDA_VISIBLE_DEVICES: "0"
      MODEL_CACHE_DIR: /models
      JOB_ARTIFACTS_DIR: /jobs
      HF_HOME: /models/huggingface
      HF_TOKEN_PATH: /run/secrets/hf_token
      MUSETALK_DTYPE: ${MUSETALK_DTYPE:-fp16}
      MUSETALK_WARMUP_MODELS: "1"
      AVATAR_WARMUP_INFERENCE: "1"
      AVATAR_WARMUP_AUDIO_PATH: ${AVATAR_WARMUP_AUDIO_PATH:-/models/avatar-warmup/speech.wav}
      AVATAR_WARMUP_IMAGE_PATH: ${AVATAR_WARMUP_IMAGE_PATH:-/models/avatar-warmup/portrait.png}
      MUSETALK_VIDEO_ENCODER: h264_nvenc
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
      AVATAR_GPU_COMPOSITE: ${AVATAR_GPU_COMPOSITE:-1}
      OMP_NUM_THREADS: "8"
      MKL_NUM_THREADS: "8"
    volumes:
      - models:/models
      - jobs:/jobs
      - ${HF_TOKEN_FILE:-/dev/null}:/run/secrets/hf_token:ro
    ports: ["127.0.0.1:8093:8000"]
    deploy:
      resources:
        limits: {cpus: "16.0", memory: 32g}
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${AVATAR_MUSETALK_GPU:-6}"]
              capabilities: [gpu]
  ingest-webrtc:
    environment:
      AVATAR_BACKEND_URL: http://localhost:8092
      AVATAR_MUSETALK_URL: http://localhost:8093
      AVATAR_REQUIRE_WARM_MODELS: "1"
    depends_on:
      - backend-avatar
      - musetalk-avatar
